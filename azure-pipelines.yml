# Create an Azure DevOps pipeline YAML that installs dependencies, runs tests, and deploys a Node.js app.
name: Node.js CI/CD Pipeline

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

jobs:
  - job: BuildAndTest
    displayName: 'Build and Test'
    steps:
      - checkout: self

      - task: NodeTool@0
        inputs:
          versionSpec: '18.x'
        displayName: 'Install Node.js'

      - script: |
          npm ci
        displayName: 'Install dependencies'

      - script: |
          npm test
        displayName: 'Run tests'

  - job: Deploy
    displayName: 'Deploy Application'
    dependsOn: BuildAndTest
    condition: succeeded()
    steps:
      - script: |
          echo "Deploying application..."
          # Add your deployment commands here
        displayName: 'Deploy application'
